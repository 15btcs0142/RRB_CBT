<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Results - RRB CBT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f5e9 100%);
            animation: gradientShift 15s ease infinite;
            background-size: 200% 200%;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .admin-nav {
            background: linear-gradient(90deg, #1b5e20, #2e7d32, #1b5e20);
            background-size: 200% auto;
            animation: navGlow 5s linear infinite;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        @keyframes navGlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .marquee-container {
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            margin: 20px auto 10px;
            max-width: 900px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #2e7d32;
            backdrop-filter: blur(5px);
        }
        .marquee-container marquee {
            font-size: 1.1rem;
            color: #1b5e20;
            font-weight: 500;
        }
        .marquee-container i {
            margin: 0 15px;
            color: #ff9800;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(46,125,50,0.2);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #2e7d32, #81c784, #2e7d32);
            background-size: 200% auto;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .card h3 {
            color: #1b5e20;
            margin-bottom: 25px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px dashed #c8e6c9;
            padding-bottom: 15px;
        }
        .card h3 i {
            color: #2e7d32;
            font-size: 2rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            color: #1b5e20;
            display: block;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        label i {
            margin-right: 8px;
            color: #2e7d32;
        }
        select, input[type="date"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            background: white;
        }
        select:focus, input[type="date"]:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.2);
            outline: none;
        }
        .btn-green {
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            margin-top: 10px;
        }
        .btn-green:hover {
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(46,125,50,0.4);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link i {
            margin-right: 8px;
        }
        .hint {
            color: #666;
            font-size: 0.9rem;
            margin-top: 15px;
            text-align: center;
        }
        .hint i {
            color: #ff9800;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="watermark">RRB Group of Schools</div>
    
    <nav class="admin-nav">
        <h1><i class="fas fa-file-export"></i> Export Results</h1>
        <a href="/admin/dashboard"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </nav>

    <div class="marquee-container">
        <marquee behavior="scroll" direction="left" scrollamount="6" onmouseover="this.stop();" onmouseout="this.start();">
            <i class="fas fa-circle"></i> Filter results by class, subject, and date range
            <i class="fas fa-calendar-alt"></i> Leave dates empty to include all records
            <i class="fas fa-download"></i> Export customized Excel report
        </marquee>
    </div>

    <div class="container">
        <div class="card">
            <h3><i class="fas fa-filter"></i> Filter Results</h3>
            <form action="/admin/export/results" method="GET">
                <div class="form-group">
                    <label for="class"><i class="fas fa-graduation-cap"></i> Class</label>
                    <select name="class" id="class">
                        <option value="All">All Classes</option>
                        {% for c in classes %}
                        <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="subject"><i class="fas fa-book"></i> Subject</label>
                    <select name="subject" id="subject">
                        <option value="All">All Subjects</option>
                        {% for s in subjects %}
                        <option value="{{ s }}">{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="start_date"><i class="fas fa-calendar-alt"></i> Start Date (Optional)</label>
                    <input type="date" name="start_date" id="start_date">
                </div>
                <div class="form-group">
                    <label for="end_date"><i class="fas fa-calendar-check"></i> End Date (Optional)</label>
                    <input type="date" name="end_date" id="end_date">
                </div>
                <button type="submit" class="btn-green"><i class="fas fa-file-excel"></i> Export Excel</button>
            </form>
            <div class="hint">
                <i class="fas fa-info-circle"></i> Leave dates empty to include all records. Start and end dates are inclusive.
            </div>
        </div>
        <a href="/admin/dashboard" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</body>
</html>
