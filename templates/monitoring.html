<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Exam Monitoring — Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --tb-navy: #0f172a;
            --tb-navy-light: #1e293b;
            --tb-blue: #0ea5e9;
            --tb-blue-dark: #0284c7;
            --tb-teal: #10b981;
            --tb-amber: #f59e0b;
            --tb-red: #ef4444;
            --tb-slate: #64748b;
            --tb-bg: #f8fafc;
            --tb-card-bg: #ffffff;
            --tb-border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--tb-bg);
            color: #334155;
            min-height: 100vh;
        }

        /* ─── TOPBAR ────────────────────────────────────────────────────────── */
        .topbar {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-title .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(14, 165, 233, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tb-blue);
            font-size: 1.2rem;
        }

        .topbar-title h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .topbar-title p {
            font-size: 0.78rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .refresh-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .refresh-pill i {
            color: var(--tb-blue);
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
            color: #fff;
        }

        /* ─── CONTAINER ────────────────────────────────────────────────────── */
        .container {
            max-width: 1500px;
            margin: 24px auto;
            padding: 0 24px;
        }

        /* ─── STAT CARDS GRID ──────────────────────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--tb-card-bg);
            border-radius: 16px;
            padding: 20px 22px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--tb-border);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border-color: #cbd5e1;
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            flex-shrink: 0;
        }

        .stat-card.total .stat-icon {
            background: #e0f2fe;
            color: #0284c7;
        }

        .stat-card.progress .stat-icon {
            background: #fef3c7;
            color: #d97706;
        }

        .stat-card.submitted .stat-icon {
            background: #d1fae5;
            color: #059669;
        }

        .stat-card.waiting .stat-icon {
            background: #f1f5f9;
            color: #64748b;
        }

        .stat-content h4 {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--tb-slate);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-content p {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--tb-navy);
            line-height: 1.1;
        }

        /* ─── FILTER & SEARCH BAR CARD ─────────────────────────────────────── */
        .filter-card {
            background: var(--tb-card-bg);
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--tb-border);
            margin-bottom: 24px;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--tb-navy);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .filter-group label i {
            color: var(--tb-blue);
            font-size: 0.85rem;
        }

        .filter-group select,
        .filter-group input[type="date"] {
            padding: 8px 14px;
            border: 1px solid var(--tb-border);
            border-radius: 10px;
            background: #ffffff;
            font-size: 0.84rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 130px;
            outline: none;
            color: #334155;
        }

        .filter-group select:focus,
        .filter-group input[type="date"]:focus {
            border-color: var(--tb-blue);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
        }

        .btn-action {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.82rem;
            font-family: inherit;
        }

        .btn-primary-tb {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: #fff;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }

        .btn-primary-tb:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.35);
        }

        .btn-secondary-tb {
            background: #f1f5f9;
            color: var(--tb-navy);
            border: 1px solid var(--tb-border);
        }

        .btn-secondary-tb:hover {
            background: #e2e8f0;
        }

        /* ─── MAIN TABLE CARD ──────────────────────────────────────────────── */
        .table-card {
            background: var(--tb-card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--tb-border);
            overflow: hidden;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.86rem;
            text-align: left;
        }

        thead th {
            background: #f8fafc;
            color: var(--tb-navy);
            font-weight: 600;
            padding: 14px 18px;
            border-bottom: 1px solid var(--tb-border);
            white-space: nowrap;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        tbody td {
            padding: 14px 18px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
            color: #334155;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .student-flex {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-box {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.2);
            overflow: hidden;
        }

        .student-name {
            font-weight: 600;
            color: var(--tb-navy);
            display: block;
        }

        .student-id-code {
            font-family: monospace;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            color: #475569;
        }

        /* ─── STATUS PILLS ─────────────────────────────────────────────────── */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-pill.in-progress {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .status-pill.submitted {
            background: #d1fae5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .status-pill.not-started {
            background: #f1f5f9;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-view {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .btn-view:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
            color: #fff;
        }

        .btn-stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-stop:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--tb-slate);
        }

        .no-data i {
            font-size: 2.8rem;
            color: #cbd5e1;
            margin-bottom: 12px;
            display: block;
        }

        /* TOAST NOTIFICATION */
        .toast-flash {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        .toast-flash.success {
            background: #d1fae5;
            color: #047857;
            border-left: 4px solid #059669;
        }

        .toast-flash.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #dc2626;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 992px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .topbar {
                padding: 14px 16px;
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .topbar-actions {
                width: 100%;
                justify-content: space-between;
            }

            .container {
                padding: 0 12px;
                margin: 16px auto;
            }
        }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-title">
            <div class="icon-box"><i class="fas fa-desktop"></i></div>
            <div>
                <h1>Live Exam Monitoring</h1>
                <p>Admin Real-Time Exam Supervision</p>
            </div>
        </div>
        <div class="topbar-actions">
            <div class="refresh-pill">
                <i class="fas fa-sync-alt"></i>
                <span>Auto Refresh: <strong style="color:#38bdf8;">5s</strong></span>
            </div>
            <a href="/admin/dashboard" class="back-btn">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- STAT CARDS GRID -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-content">
                    <h4>Total Registered</h4>
                    <p id="statTotal">0</p>
                </div>
            </div>
            <div class="stat-card waiting">
                <div class="stat-icon"><i class="fas fa-hourglass-start"></i></div>
                <div class="stat-content">
                    <h4>Not Started</h4>
                    <p id="statNotStarted">0</p>
                </div>
            </div>
            <div class="stat-card progress">
                <div class="stat-icon"><i class="fas fa-spinner"></i></div>
                <div class="stat-content">
                    <h4>In Progress</h4>
                    <p id="statInProgress">0</p>
                </div>
            </div>
            <div class="stat-card submitted">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-content">
                    <h4>Submitted</h4>
                    <p id="statSubmitted">0</p>
                </div>
            </div>
        </div>

        <!-- FILTER CARD -->
        <div class="filter-card">
            <div class="filter-bar">
                <div class="filter-group">
                    <label><i class="fas fa-calendar-alt"></i> Date:</label>
                    <input type="date" id="filterDate" value="">
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-circle"></i> Status:</label>
                    <select id="filterStatus">
                        <option value="">All Status</option>
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Submitted">Submitted</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-graduation-cap"></i> Class:</label>
                    <select id="filterClass">
                        <option value="">All Classes</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-book"></i> Subject:</label>
                    <select id="filterSubject">
                        <option value="">All Subjects</option>
                    </select>
                </div>
                <button class="btn-action btn-primary-tb" id="applyFilterBtn">
                    <i class="fas fa-filter"></i> Apply
                </button>
                <button class="btn-action btn-secondary-tb" id="resetFilterBtn">
                    <i class="fas fa-undo-alt"></i> Reset
                </button>
            </div>
        </div>

        <!-- TABLE CARD -->
        <div class="table-card">
            <div class="table-responsive">
                <table id="monitorTable">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Class</th>
                            <th>Subject</th>
                            <th>Student ID</th>
                            <th>IP Address</th>
                            <th>Status</th>
                            <th>Exam Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="monitorBody">
                        <tr>
                            <td colspan="8" class="no-data">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p style="font-weight:500;">Loading monitoring session data...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="app-global-footer"
            style="width:100%; text-align:center; padding:24px 10px; font-size:0.82rem; color:#94a3b8; opacity:0.85; margin-top:28px; border-top:1px solid #e2e8f0; clear:both;">
            Developed by Gaurav Shukla &amp; Team
        </footer>
    </div>

    <script>
        let allStudents = [];
        const $ = id => document.getElementById(id);
        const filterDate = $('filterDate');
        const filterStatus = $('filterStatus');
        const filterClass = $('filterClass');
        const filterSubject = $('filterSubject');
        const applyFilterBtn = $('applyFilterBtn');
        const resetFilterBtn = $('resetFilterBtn');
        const monitorBody = $('monitorBody');

        filterDate.value = '';

        function fetchData() {
            fetch('/admin/monitoring/data')
                .then(res => res.json())
                .then(data => {
                    allStudents = data;
                    populateFilterDropdowns(data);
                    applyFilters();
                })
                .catch(err => console.error('Error fetching monitoring data:', err));
        }

        function populateFilterDropdowns(data) {
            const classes = [...new Set(data.map(s => s.class))].filter(c => c).sort();
            const subjects = [...new Set(data.map(s => s.subject))].filter(s => s).sort();

            const classSelect = filterClass;
            const subjectSelect = filterSubject;
            const currentClass = classSelect.value;
            const currentSubject = subjectSelect.value;

            classSelect.innerHTML = '<option value="">All Classes</option>';
            classes.forEach(c => { classSelect.innerHTML += `<option value="${c}">${c}</option>`; });
            if (currentClass) classSelect.value = currentClass;

            subjectSelect.innerHTML = '<option value="">All Subjects</option>';
            subjects.forEach(s => { subjectSelect.innerHTML += `<option value="${s}">${s}</option>`; });
            if (currentSubject) subjectSelect.value = currentSubject;
        }

        function applyFilters() {
            const dateVal = filterDate.value;
            const statusVal = filterStatus.value;
            const classVal = filterClass.value;
            const subjectVal = filterSubject.value;

            let filtered = allStudents.filter(s => {
                if (dateVal) {
                    const studentDate = s.exam_started_at ? s.exam_started_at.split(' ')[0] : null;
                    if (studentDate !== dateVal) return false;
                }
                if (statusVal && s.status !== statusVal) return false;
                if (classVal && s.class !== classVal) return false;
                if (subjectVal && s.subject !== subjectVal) return false;
                return true;
            });

            renderTable(filtered);
            updateStats(filtered);
        }

        function renderTable(students) {
            if (students.length === 0) {
                monitorBody.innerHTML = `<tr><td colspan="8" class="no-data">
                    <i class="fas fa-user-slash"></i>
                    <p style="font-weight:600;color:#64748b;margin-bottom:4px;">No students match the selected filters</p>
                    <span style="font-size:0.8rem;color:#94a3b8;">Try resetting date or status filters.</span>
                </td></tr>`;
                return;
            }

            let html = '';
            students.forEach(s => {
                let statusBadgeHtml = '';
                if (s.status === 'In Progress') {
                    statusBadgeHtml = `<span class="status-pill in-progress"><i class="fas fa-spinner fa-spin" style="font-size:0.7rem;"></i> In Progress</span>`;
                } else if (s.status === 'Submitted') {
                    statusBadgeHtml = `<span class="status-pill submitted"><i class="fas fa-check-circle"></i> Submitted</span>`;
                } else {
                    statusBadgeHtml = `<span class="status-pill not-started"><i class="fas fa-circle" style="font-size:0.5rem;opacity:0.6;"></i> Not Started</span>`;
                }

                const examDate = s.exam_started_at ? s.exam_started_at.split(' ')[0] : '—';
                const avatarChar = (s.name || 'S').charAt(0).toUpperCase();

                html += `
                    <tr>
                        <td>
                            <div class="student-flex">
                                <div class="avatar-box">${avatarChar}</div>
                                <span class="student-name">${s.name}</span>
                            </div>
                        </td>
                        <td><span style="background:#f1f5f9;color:#334155;padding:3px 10px;border-radius:12px;font-weight:500;font-size:0.78rem;">${s.class}</span></td>
                        <td><span style="background:#e0f2fe;color:#0369a1;padding:3px 10px;border-radius:12px;font-weight:500;font-size:0.78rem;">${s.subject}</span></td>
                        <td><code class="student-id-code">${s.student_id}</code></td>
                        <td><code style="color:#64748b;font-size:0.78rem;"><i class="fas fa-network-wired" style="color:var(--tb-blue);margin-right:4px;"></i>${s.ip}</code></td>
                        <td>${statusBadgeHtml}</td>
                        <td><code style="background:#f1f5f9;padding:3px 8px;border-radius:6px;font-size:0.78rem;color:#475569;">${examDate}</code></td>
                        <td>
                            <div class="action-group">
                                <a href="/admin/student/responses/${s.student_id}" class="btn-view" target="_blank">
                                    <i class="fas fa-external-link-alt"></i> View
                                </a>
                                ${s.status === 'In Progress' ? `
                                <button class="btn-stop" onclick="forceSubmitStudent('${s.student_id}', '${s.name.replace(/'/g, '&#39;')}', this)">
                                    <i class="fas fa-stop-circle"></i> Stop
                                </button>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });
            monitorBody.innerHTML = html;
        }

        function updateStats(students) {
            document.getElementById('statTotal').textContent = students.length;
            document.getElementById('statNotStarted').textContent = students.filter(s => s.status === 'Not Started').length;
            document.getElementById('statInProgress').textContent = students.filter(s => s.status === 'In Progress').length;
            document.getElementById('statSubmitted').textContent = students.filter(s => s.status === 'Submitted').length;
        }

        function resetFilters() {
            filterDate.value = '';
            filterStatus.value = '';
            filterClass.value = '';
            filterSubject.value = '';
            applyFilters();
        }

        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast-flash');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast-flash ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        async function forceSubmitStudent(studentId, studentName, btn) {
            if (!confirm(`Stop exam for ${studentName}?\n\nThis will submit their exam immediately with current answers.`)) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const res = await fetch(`/admin/student/force_submit/${studentId}`, { method: 'POST' });
                const data = await res.json();

                if (data.status === 'success') {
                    showToast(`✓ ${studentName} submitted successfully`, 'success');
                    setTimeout(fetchData, 800);
                } else {
                    showToast(data.message || 'Failed to submit', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-stop-circle"></i> Stop';
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-stop-circle"></i> Stop';
            }
        }

        applyFilterBtn.addEventListener('click', applyFilters);
        resetFilterBtn.addEventListener('click', resetFilters);

        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>

</html>
