<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login - RRB CBT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #c5cae9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ─── Floating particles background ──────────────────────────── */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(26, 35, 126, 0.06);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }
        .particle:nth-child(1) { left: 10%; animation-duration: 12s; animation-delay: 0s; width: 12px; height: 12px; }
        .particle:nth-child(2) { left: 20%; animation-duration: 15s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-duration: 10s; animation-delay: 1s; width: 6px; height: 6px; }
        .particle:nth-child(4) { left: 40%; animation-duration: 18s; animation-delay: 3s; width: 14px; height: 14px; }
        .particle:nth-child(5) { left: 50%; animation-duration: 13s; animation-delay: 0.5s; }
        .particle:nth-child(6) { left: 60%; animation-duration: 16s; animation-delay: 2.5s; width: 10px; height: 10px; }
        .particle:nth-child(7) { left: 70%; animation-duration: 11s; animation-delay: 1.5s; }
        .particle:nth-child(8) { left: 80%; animation-duration: 14s; animation-delay: 3.5s; width: 8px; height: 8px; }
        .particle:nth-child(9) { left: 90%; animation-duration: 17s; animation-delay: 0.8s; width: 16px; height: 16px; }
        .particle:nth-child(10) { left: 95%; animation-duration: 12s; animation-delay: 2s; }
        
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ─── Watermark ────────────────────────────────────────────────── */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 6vw;
            color: rgba(26, 35, 126, 0.04);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 8px;
            user-select: none;
        }

        /* ─── Login Container ──────────────────────────────────────────── */
        .login-container {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            padding: 40px 38px 35px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(26, 35, 126, 0.12);
            max-width: 440px;
            width: 100%;
            z-index: 1;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .login-container:hover {
            transform: translateY(-3px);
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #1a237e, #667eea, #1a237e);
            background-size: 200% auto;
            animation: shimmer 2.5s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* ─── Logo Section ────────────────────────────────────────────── */
        .logo-section {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo-section .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #1a237e, #3949ab);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 10px 30px rgba(26, 35, 126, 0.2);
        }
        .logo-section .logo-icon i {
            font-size: 2.4rem;
            color: white;
        }
        .logo-section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 4px;
        }
        .logo-section p {
            color: #888;
            font-size: 0.85rem;
        }

        /* ─── Error Message ───────────────────────────────────────────── */
        .error-message {
            background: #fce4ec;
            border-left: 4px solid #c62828;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #c62828;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .error-message i {
            font-size: 1.1rem;
        }

        /* ─── Form ────────────────────────────────────────────────────── */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .form-group label i {
            margin-right: 8px;
            color: #3949ab;
            width: 18px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3949ab;
            box-shadow: 0 0 0 3px rgba(57, 73, 171, 0.12);
            background: #fff;
        }
        .form-group input::placeholder {
            color: #bbb;
        }

        /* ─── Submit Button ───────────────────────────────────────────── */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a237e, #3949ab);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(26, 35, 126, 0.3);
        }
        .submit-btn:active {
            transform: translateY(0);
        }

        /* ─── Forgot Password ──────────────────────────────────────────── */
        .forgot-password {
            text-align: center;
            margin-top: 18px;
            color: #888;
            font-size: 0.85rem;
        }
        .forgot-password i {
            color: #3949ab;
            margin-right: 4px;
        }

        /* ─── Links ────────────────────────────────────────────────────── */
        .links {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #e8ecf0;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .links a {
            color: #555;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .links a:hover {
            color: #1a237e;
        }
        .links a i {
            color: #3949ab;
        }

        /* ─── Responsive ────────────────────────────────────────────────── */
        @media (max-width: 480px) {
            .login-container {
                padding: 28px 20px 24px;
                border-radius: 18px;
            }
            .logo-section .logo-icon {
                width: 60px;
                height: 60px;
            }
            .logo-section .logo-icon i {
                font-size: 2rem;
            }
            .logo-section h2 {
                font-size: 1.3rem;
            }
            .form-group input {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            .submit-btn {
                padding: 12px;
                font-size: 0.95rem;
            }
            .links {
                flex-direction: column;
                gap: 8px;
            }
            .watermark {
                font-size: 12vw;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Floating Particles ────────────────────────────────────────── -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ─── Watermark ──────────────────────────────────────────────────── -->
    <div class="watermark">RRB Group of Schools</div>

    <!-- ─── Login Container ────────────────────────────────────────────── -->
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-chalkboard-teacher"></i>
            </div>
            <h2>Teacher Portal</h2>
            <p>RRB CBT System</p>
        </div>

        <!-- Error Message -->
        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/teacher">
            <div class="form-group">
                <label><i class="fas fa-mobile-alt"></i> Mobile Number</label>
                <input type="text" name="mobile" required placeholder="Enter your mobile number" pattern="[0-9]{10}">
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="footer-note" style="text-align:center; margin-top:20px; padding-top:15px; border-top:1px dashed rgba(0,0,0,0.1); font-size:0.85rem; color:#666;">
    <i class="fas fa-shield-alt" style="color:#1a237e; margin-right:5px;"></i> RRB CBT &nbsp;·&nbsp; Developed by Gaurav Shukla &amp; Team
</div>

        <div class="forgot-password">
            <i class="fas fa-info-circle"></i> Forgot password? Contact Admin
        </div>

        <div class="links">
            <a href="/"><i class="fas fa-home"></i> Student Login</a>
            <a href="/admin"><i class="fas fa-user-shield"></i> Admin Login</a>
        </div>
        </div>

</body>
</html>
