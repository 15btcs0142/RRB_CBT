<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RRB CBT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#1b5e20,#2e7d32,#43a047);min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .login-box{background:white;border-radius:20px;padding:45px 40px;max-width:420px;width:90%;box-shadow:0 25px 70px rgba(0,0,0,0.35);text-align:center;}
        .logo-wrap{margin-bottom:20px;}
        .logo-wrap img{height:70px;border-radius:50%;border:3px solid #2e7d32;}
        .logo-icon{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#1b5e20,#2e7d32);display:flex;align-items:center;justify-content:center;font-size:2rem;color:white;margin:0 auto;}
        .school-name{font-size:1.3rem;font-weight:700;color:#1b5e20;margin-bottom:4px;}
        .portal-label{font-size:0.85rem;color:#888;margin-bottom:25px;}
        .err{background:#fde;border-left:4px solid #e53935;color:#b71c1c;padding:10px 14px;border-radius:8px;text-align:left;margin-bottom:18px;font-size:0.88rem;}
        .fg{margin-bottom:16px;text-align:left;}
        .fg label{display:block;font-weight:500;margin-bottom:6px;color:#333;font-size:0.88rem;}
        .fg label i{color:#2e7d32;margin-right:5px;}
        .fg input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-family:'Poppins',sans-serif;font-size:0.95rem;transition:border-color 0.3s;}
        .fg input:focus{outline:none;border-color:#2e7d32;}
        .login-btn{width:100%;background:linear-gradient(135deg,#1b5e20,#2e7d32);color:white;border:none;padding:14px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform 0.2s;}
        .login-btn:hover{transform:translateY(-2px);}
        .back-link{display:block;margin-top:18px;color:#888;font-size:0.85rem;text-decoration:none;}
        .back-link:hover{color:#2e7d32;}
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo-wrap">
        <div class="logo-icon"><i class="fas fa-user-shield"></i></div>
    </div>
    <div class="school-name">RRB Group of Schools</div>
    <div class="portal-label">Administrator Portal</div>

    {% if error %}<div class="err"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>{% endif %}

    <form action="/admin" method="POST">
        <div class="fg">
            <label><i class="fas fa-lock"></i> Admin Password</label>
            <input type="password" name="password" required autofocus placeholder="Enter admin password">
        </div>
        <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login as Admin</button>
    </form>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Student Portal</a>
</div>
</body>
</html>
