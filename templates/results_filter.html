<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Hierarchical Filter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        .content {
            padding: 40px;
        }
        .filter-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        .filter-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        .filter-group select,
        .filter-group input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .filter-group select:hover,
        .filter-group input:hover {
            border-color: #667eea;
        }
        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .filter-group select:disabled,
        .filter-group input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .filter-group select option {
            padding: 10px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-export {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }
        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }
        .btn-print {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }
        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }
        .btn-reset {
            background: #95989a;
            color: white;
            flex: 1;
            min-width: 150px;
        }
        .btn-reset:hover {
            background: #6c7072;
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .results-section {
            margin-top: 40px;
            border-top: 2px solid #e0e0e0;
            padding-top: 30px;
        }
        .results-info {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .results-info h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .results-info p {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
        }
        .results-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .results-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        .results-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .results-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        .results-table tbody tr:nth-child(even) {
            background-color: #fafafa;
        }
        .results-table .score-good {
            color: #4caf50;
            font-weight: 600;
        }
        .results-table .score-average {
            color: #ff9800;
            font-weight: 600;
        }
        .results-table .score-poor {
            color: #f44336;
            font-weight: 600;
        }
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.1em;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
            color: #667eea;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        .breadcrumb {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .breadcrumb-item {
            padding: 5px 12px;
            background: #e0e0e0;
            border-radius: 20px;
            font-size: 0.9em;
            color: #333;
        }
        .breadcrumb-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .breadcrumb-separator {
            color: #999;
            font-weight: bold;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            gap: 10px;
        }
        .step {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            font-weight: 600;
            color: #999;
            position: relative;
        }
        .step.completed {
            background: #e8f5e9;
            color: #4caf50;
        }
        .step.active {
            background: #e3f2fd;
            color: #2196f3;
            box-shadow: 0 0 0 2px #2196f3;
        }
        .step::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 2px;
            background: #ddd;
        }
        .step:last-child::after {
            display: none;
        }
        @media print {
            body {
                background: white;
            }
            .button-group {
                display: none;
            }
            .filter-section {
                display: none;
            }
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            .content {
                padding: 20px;
            }
            .filter-section {
                grid-template-columns: 1fr;
            }
            .button-group {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
            .results-table {
                font-size: 0.9em;
            }
            .results-table th,
            .results-table td {
                padding: 8px;
            }
            .step-indicator {
                flex-direction: column;
            }
            .step::after {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Results Filter</h1>
            <p>Select Class → Subject → Test → Date to view and export results</p>
        </div>

        <div class="content">
            <div class="step-indicator">
                <div class="step active" id="step-class">Class</div>
                <div class="step" id="step-subject">Subject</div>
                <div class="step" id="step-test">Test</div>
                <div class="step" id="step-date">Date</div>
                <div class="step" id="step-results">Results</div>
            </div>

            <div id="breadcrumb-container" class="breadcrumb" style="display: none;"></div>

            <form id="filterForm">
                <div class="filter-section">
                    <div class="filter-group">
                        <label for="classSelect">📚 Step 1: Select Class</label>
                        <select id="classSelect" required>
                            <option value="">-- Choose a Class --</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="subjectSelect">📖 Step 2: Select Subject</label>
                        <select id="subjectSelect" disabled required>
                            <option value="">-- Choose a Subject --</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="testSelect">📝 Step 3: Select Test No</label>
                        <select id="testSelect" disabled required>
                            <option value="">-- Choose a Test No --</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="dateSelect">📅 Step 4: Select Date</label>
                        <select id="dateSelect" disabled required>
                            <option value="">-- Choose a Date --</option>
                        </select>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-primary" id="viewBtn" onclick="loadResults()" disabled>View Results</button>
                    <button type="button" class="btn-export" id="exportBtn" onclick="exportToExcel()" disabled>📥 Export Excel</button>
                    <button type="button" class="btn-print" id="printBtn" onclick="printResults()" disabled>🖨️ Print PDF</button>
                    <button type="reset" class="btn-reset" onclick="resetForm()">Reset</button>
                </div>
            </form>

            <div id="resultsContainer" class="results-section" style="display: none;">
                <div id="resultsInfo" class="results-info"></div>
                <table id="resultsTable" class="results-table">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Subject</th>
                            <th>Score</th>
                            <th>Percentage</th>
                            <th>Test Date</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Initialize
        loadClasses();

        // Load classes on page load
        function loadClasses() {
            fetch('/api/admin/results/get_classes')
                .then(response => response.json())
                .then(data => {
                    const classSelect = document.getElementById('classSelect');
                    classSelect.innerHTML = '<option value="">-- Choose a Class --</option>';
                    data.classes.forEach(cls => {
                        const option = document.createElement('option');
                        option.value = cls;
                        option.textContent = cls;
                        classSelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Error loading classes:', error));
        }

        // Class selection change event
        document.getElementById('classSelect').addEventListener('change', function() {
            const selectedClass = this.value;
            const subjectSelect = document.getElementById('subjectSelect');
            const testSelect = document.getElementById('testSelect');
            const dateSelect = document.getElementById('dateSelect');

            subjectSelect.innerHTML = '<option value="">-- Choose a Subject --</option>';
            testSelect.innerHTML = '<option value="">-- Choose a Test No --</option>';
            dateSelect.innerHTML = '<option value="">-- Choose a Date --</option>';

            if (selectedClass) {
                subjectSelect.disabled = false;
                updateStep('class', true);
                updateStep('subject', false);
                
                fetch(`/api/admin/results/get_subjects/${encodeURIComponent(selectedClass)}`)
                    .then(response => response.json())
                    .then(data => {
                        data.subjects.forEach(subject => {
                            const option = document.createElement('option');
                            option.value = subject;
                            option.textContent = subject;
                            subjectSelect.appendChild(option);
                        });
                    })
                    .catch(error => console.error('Error loading subjects:', error));
            } else {
                subjectSelect.disabled = true;
                testSelect.disabled = true;
                dateSelect.disabled = true;
                updateStep('class', false);
            }

            updateBreadcrumb();
            document.getElementById('resultsContainer').style.display = 'none';
        });

        // Subject selection change event
        document.getElementById('subjectSelect').addEventListener('change', function() {
            const selectedClass = document.getElementById('classSelect').value;
            const selectedSubject = this.value;
            const testSelect = document.getElementById('testSelect');
            const dateSelect = document.getElementById('dateSelect');

            testSelect.innerHTML = '<option value="">-- Choose a Test No --</option>';
            dateSelect.innerHTML = '<option value="">-- Choose a Date --</option>';

            if (selectedSubject) {
                testSelect.disabled = false;
                updateStep('subject', true);
                updateStep('test', false);

                fetch(`/api/admin/results/get_test_numbers/${encodeURIComponent(selectedClass)}/${encodeURIComponent(selectedSubject)}`)
                    .then(response => response.json())
                    .then(data => {
                        data.test_numbers.forEach(testNo => {
                            const option = document.createElement('option');
                            option.value = testNo;
                            option.textContent = testNo;
                            testSelect.appendChild(option);
                        });
                    })
                    .catch(error => console.error('Error loading test numbers:', error));
            } else {
                testSelect.disabled = true;
                dateSelect.disabled = true;
                updateStep('subject', false);
            }

            updateBreadcrumb();
            document.getElementById('resultsContainer').style.display = 'none';
        });

        // Test selection change event
        document.getElementById('testSelect').addEventListener('change', function() {
            const selectedClass = document.getElementById('classSelect').value;
            const selectedSubject = document.getElementById('subjectSelect').value;
            const selectedTest = this.value;
            const dateSelect = document.getElementById('dateSelect');

            dateSelect.innerHTML = '<option value="">-- Choose a Date --</option>';

            if (selectedTest) {
                dateSelect.disabled = false;
                updateStep('test', true);
                updateStep('date', false);

                fetch(`/api/admin/results/get_dates/${encodeURIComponent(selectedClass)}/${encodeURIComponent(selectedSubject)}/${encodeURIComponent(selectedTest)}`)
                    .then(response => response.json())
                    .then(data => {
                        data.dates.forEach(date => {
                            const option = document.createElement('option');
                            option.value = date;
                            option.textContent = date;
                            dateSelect.appendChild(option);
                        });
                    })
                    .catch(error => console.error('Error loading dates:', error));
            } else {
                dateSelect.disabled = true;
                updateStep('test', false);
            }

            updateBreadcrumb();
            document.getElementById('resultsContainer').style.display = 'none';
        });

        // Date selection change event
        document.getElementById('dateSelect').addEventListener('change', function() {
            const selectedDate = this.value;
            
            if (selectedDate) {
                updateStep('date', true);
                updateStep('results', false);
                document.getElementById('viewBtn').disabled = false;
                document.getElementById('exportBtn').disabled = false;
                document.getElementById('printBtn').disabled = false;
            } else {
                updateStep('date', false);
                document.getElementById('viewBtn').disabled = true;
                document.getElementById('exportBtn').disabled = true;
                document.getElementById('printBtn').disabled = true;
            }

            updateBreadcrumb();
            document.getElementById('resultsContainer').style.display = 'none';
        });

        // Load and display results
        function loadResults() {
            const selectedClass = document.getElementById('classSelect').value;
            const selectedSubject = document.getElementById('subjectSelect').value;
            const selectedTest = document.getElementById('testSelect').value;
            const selectedDate = document.getElementById('dateSelect').value;

            if (!selectedClass || !selectedSubject || !selectedTest || !selectedDate) {
                alert('Please complete all filter selections');
                return;
            }

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading"></div>';
            resultsContainer.style.display = 'block';

            const params = new URLSearchParams({
                class: selectedClass,
                subject: selectedSubject,
                test_no: selectedTest,
                date: selectedDate
            });

            fetch(`/api/admin/results/get_filtered_results?${params}`)
                .then(response => response.json())
                .then(data => {
                    updateStep('results', true);
                    displayResults(data);
                })
                .catch(error => {
                    console.error('Error loading results:', error);
                    resultsContainer.innerHTML = '<div class="no-results">Error loading results. Please try again.</div>';
                });
        }

        // Display results in table
        function displayResults(data) {
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsInfo = document.getElementById('resultsInfo');
            const resultsBody = document.getElementById('resultsBody');

            if (data.results.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">No results found for the selected filters.</div>';
                return;
            }

            // Display filter info
            const filterInfo = `
                <h3>📋 Results Summary</h3>
                <p><strong>Class:</strong> ${data.filters.class} | 
                   <strong>Subject:</strong> ${data.filters.subject} | 
                   <strong>Test:</strong> ${data.filters.test_no} | 
                   <strong>Date:</strong> ${data.filters.date} | 
                   <strong>Total Students:</strong> ${data.count}</p>
            `;
            resultsInfo.innerHTML = filterInfo;

            // Clear table body
            resultsBody.innerHTML = '';

            // Populate table
            data.results.forEach(result => {
                const row = document.createElement('tr');
                const percentage = result.percentage ? parseFloat(result.percentage).toFixed(1) : 'N/A';
                let scoreClass = '';
                if (percentage !== 'N/A') {
                    if (percentage >= 75) scoreClass = 'score-good';
                    else if (percentage >= 50) scoreClass = 'score-average';
                    else scoreClass = 'score-poor';
                }

                row.innerHTML = `
                    <td>${result.student_id}</td>
                    <td>${result.name}</td>
                    <td>${result.class}</td>
                    <td>${result.subject}</td>
                    <td>${result.score}/${result.total_questions}</td>
                    <td class="${scoreClass}">${percentage}%</td>
                    <td>${result.test_date ? result.test_date.substring(0, 10) : 'N/A'}</td>
                `;
                resultsBody.appendChild(row);
            });

            resultsContainer.style.display = 'block';
        }

        // Export to Excel
        function exportToExcel() {
            const selectedClass = document.getElementById('classSelect').value;
            const selectedSubject = document.getElementById('subjectSelect').value;
            const selectedTest = document.getElementById('testSelect').value;
            const selectedDate = document.getElementById('dateSelect').value;

            const params = new URLSearchParams({
                class: selectedClass,
                subject: selectedSubject,
                test_no: selectedTest,
                date: selectedDate
            });

            // Use existing export endpoint
            window.location.href = `/admin/export/results?${params.toString().replace(/test_no=/, 'chapter=')}`;
        }

        // Print PDF
        function printResults() {
            window.print();
        }

        // Reset form
        function resetForm() {
            document.getElementById('filterForm').reset();
            document.getElementById('subjectSelect').disabled = true;
            document.getElementById('testSelect').disabled = true;
            document.getElementById('dateSelect').disabled = true;
            document.getElementById('viewBtn').disabled = true;
            document.getElementById('exportBtn').disabled = true;
            document.getElementById('printBtn').disabled = true;
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('breadcrumb-container').style.display = 'none';
            
            // Reset steps
            for (let i = 1; i <= 5; i++) {
                updateStep(['class', 'subject', 'test', 'date', 'results'][i-1], false);
            }
            updateStep('class', false);
        }

        // Update step indicator
        function updateStep(stepName, completed) {
            const stepMap = {
                'class': 'step-class',
                'subject': 'step-subject',
                'test': 'step-test',
                'date': 'step-date',
                'results': 'step-results'
            };

            const stepElement = document.getElementById(stepMap[stepName]);
            if (stepElement) {
                if (completed) {
                    stepElement.classList.add('completed');
                    stepElement.classList.remove('active');
                } else {
                    stepElement.classList.remove('completed');
                    stepElement.classList.remove('active');
                }
            }
        }

        // Update breadcrumb
        function updateBreadcrumb() {
            const breadcrumbContainer = document.getElementById('breadcrumb-container');
            const selectedClass = document.getElementById('classSelect').value;
            const selectedSubject = document.getElementById('subjectSelect').value;
            const selectedTest = document.getElementById('testSelect').value;
            const selectedDate = document.getElementById('dateSelect').value;

            let breadcrumb = '';

            if (selectedClass) {
                breadcrumb += `<span class="breadcrumb-item active">${selectedClass}</span>`;
                if (selectedSubject) {
                    breadcrumb += '<span class="breadcrumb-separator">→</span>';
                    breadcrumb += `<span class="breadcrumb-item active">${selectedSubject}</span>`;
                    if (selectedTest) {
                        breadcrumb += '<span class="breadcrumb-separator">→</span>';
                        breadcrumb += `<span class="breadcrumb-item active">${selectedTest}</span>`;
                        if (selectedDate) {
                            breadcrumb += '<span class="breadcrumb-separator">→</span>';
                            breadcrumb += `<span class="breadcrumb-item active">${selectedDate}</span>`;
                        }
                    }
                }
            }

            if (breadcrumb) {
                breadcrumbContainer.innerHTML = breadcrumb;
                breadcrumbContainer.style.display = 'flex';
            } else {
                breadcrumbContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
