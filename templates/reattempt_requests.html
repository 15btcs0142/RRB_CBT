<!DOCTYPE html>
<html>
<head>
    <title>Reattempt Requests - RRB CBT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }

        /* ─── TOP BAR ────────────────────────────────────────────────────── */
        .topbar {
            background: linear-gradient(90deg, #1a237e, #3949ab);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            color: #fff;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar h1 {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar h1 i {
            color: #667eea;
        }
        .topbar a {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .topbar a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 20px;
        }

        /* ─── FILTER BAR ────────────────────────────────────────────────── */
        .filter-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 22px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            border: 1px solid rgba(26, 35, 126, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .filter-bar label {
            font-weight: 600;
            color: #1a237e;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-bar label i {
            color: #3949ab;
        }
        .filter-bar select {
            padding: 8px 16px;
            border-radius: 30px;
            border: 2px solid #e0e0e0;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            background: #fafafa;
            transition: 0.3s;
            min-width: 140px;
            cursor: pointer;
        }
        .filter-bar select:focus {
            border-color: #3949ab;
            outline: none;
            box-shadow: 0 0 0 3px rgba(57, 73, 171, 0.12);
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-family: 'Poppins', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(26, 35, 126, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: #555;
            border: 2px solid #ddd;
        }
        .btn-outline:hover {
            background: #f5f5f5;
            transform: none;
        }
        .exam-status {
            margin-left: auto;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #e0e0e0;
        }
        .exam-status.active {
            background: #e8f5e9;
            color: #1b5e20;
            border-color: #a5d6a7;
        }
        .exam-status.inactive {
            background: #ffebee;
            color: #c62828;
            border-color: #ef9a9a;
        }
        .exam-status i {
            font-size: 0.6rem;
        }

        /* ─── TABLE ──────────────────────────────────────────────────────── */
        .table-wrap {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(26, 35, 126, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            color: #fff;
            font-weight: 600;
            padding: 14px 16px;
            text-align: left;
            white-space: nowrap;
        }
        th i {
            margin-right: 8px;
            opacity: 0.7;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        tr:hover td {
            background: #e8eaf6;
        }
        tr:last-child td {
            border-bottom: none;
        }

        /* ─── STATUS BADGES ────────────────────────────────────────────── */
        .status-badge {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-pending {
            background: #fff3e0;
            color: #e65100;
        }
        .status-approved {
            background: #e8f5e9;
            color: #1b5e20;
        }
        .status-rejected {
            background: #fce4ec;
            color: #c62828;
        }

        /* ─── ACTION BUTTONS ────────────────────────────────────────────── */
        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 0.72rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .btn-sm:hover {
            transform: translateY(-2px);
        }
        .btn-approve {
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            color: #fff;
        }
        .btn-approve:hover {
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.3);
        }
        .btn-reject {
            background: linear-gradient(135deg, #b71c1c, #c62828);
            color: #fff;
        }
        .btn-reject:hover {
            box-shadow: 0 4px 12px rgba(198, 40, 40, 0.3);
        }
        .btn-sm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ─── EMPTY STATE ────────────────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .empty-state i {
            font-size: 3rem;
            color: #ddd;
            display: block;
            margin-bottom: 12px;
        }

        /* ─── TOAST ──────────────────────────────────────────────────────── */
        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
            animation: slideIn 0.4s ease;
        }
        .toast-message.success {
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
        }
        .toast-message.error {
            background: linear-gradient(135deg, #b71c1c, #c62828);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── RESPONSIVE ────────────────────────────────────────────────── */
        @media (max-width: 820px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar select {
                width: 100%;
            }
            .exam-status {
                margin-left: 0;
                justify-content: center;
            }
            .topbar {
                flex-direction: column;
                text-align: center;
                padding: 12px 16px;
            }
            .topbar a {
                font-size: 0.75rem;
                padding: 6px 14px;
            }
            .container {
                padding: 0 12px;
                margin: 16px auto;
            }
        }
        @media (max-width: 600px) {
            table {
                font-size: 0.75rem;
            }
            th, td {
                padding: 8px 10px;
            }
            .action-btns {
                flex-direction: column;
                gap: 4px;
            }
            .btn-sm {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
            .toast-message {
                left: 20px;
                right: 20px;
                bottom: 20px;
                font-size: 0.85rem;
                padding: 12px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── TOP BAR ─────────────────────────────────────────────────────── -->
    <nav class="topbar">
        <h1><i class="fas fa-redo-alt"></i> Reattempt Requests</h1>
        <a href="/admin/dashboard"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </nav>

    <div class="container">

        <!-- ─── FILTER BAR ───────────────────────────────────────────────── -->
        <div class="filter-bar">
            <label><i class="fas fa-filter"></i> Status:</label>
            <select id="statusFilter">
                <option value="">All</option>
                <option value="pending" selected>Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
            <button class="btn btn-primary" id="applyFilterBtn"><i class="fas fa-check"></i> Apply</button>
            <button class="btn btn-outline" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            <div class="exam-status" id="examStatusDisplay">
                <i class="fas fa-circle"></i> Checking...
            </div>
        </div>

        <!-- ─── TABLE ────────────────────────────────────────────────────── -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th><i class="fas fa-id-card"></i> Student ID</th>
                        <th><i class="fas fa-user"></i> Name</th>
                        <th><i class="fas fa-graduation-cap"></i> Class</th>
                        <th><i class="fas fa-book"></i> Subject</th>
                        <th><i class="fas fa-calendar-alt"></i> Requested</th>
                        <th><i class="fas fa-flag"></i> Status</th>
                        <th><i class="fas fa-cog"></i> Actions</th>
                    </tr>
                </thead>
                <tbody id="requestsBody"></tbody>
            </table>
        </div>

    
<footer class="app-global-footer" style="width:100%; text-align:center; padding:20px 10px; font-size:0.85rem; color:#666; opacity:0.85; margin-top:30px; border-top:1px solid rgba(0,0,0,0.08); box-sizing:border-box; clear:both;">
    Developed by Gaurav Shukla &amp; Team
</footer>
</div>

    <script>
        let examActive = false;

        // ─── TOAST ────────────────────────────────────────────────────────
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast-message');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast-message ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // ─── UPDATE EXAM STATUS ──────────────────────────────────────────
        function updateExamStatus(active) {
            const el = document.getElementById('examStatusDisplay');
            if (active) {
                el.className = 'exam-status active';
                el.innerHTML = '<i class="fas fa-circle"></i> Exam: Active';
            } else {
                el.className = 'exam-status inactive';
                el.innerHTML = '<i class="fas fa-circle"></i> Exam: Inactive';
            }
        }

        // ─── FETCH REQUESTS ──────────────────────────────────────────────
        function fetchRequests() {
            const status = document.getElementById('statusFilter').value;
            fetch(`/admin/reattempt_requests/data?status=${status}`)
                .then(res => res.json())
                .then(data => {
                    examActive = data.exam_is_active;
                    updateExamStatus(examActive);
                    renderTable(data.requests);
                })
                .catch(err => {
                    console.error(err);
                    showToast('Failed to load requests', 'error');
                });
        }

        // ─── RENDER TABLE ────────────────────────────────────────────────
        function renderTable(requests) {
            const tbody = document.getElementById('requestsBody');
            if (!requests || requests.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            No requests found
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            requests.forEach(req => {
                const requestedDate = req.requested_at ? req.requested_at.split(' ')[0] : 'N/A';

                let statusClass = '';
                if (req.status === 'pending') statusClass = 'status-pending';
                else if (req.status === 'approved') statusClass = 'status-approved';
                else if (req.status === 'rejected') statusClass = 'status-rejected';

                let actionsHtml = '';
                if (req.status === 'pending') {
                    actionsHtml = `
                        <div class="action-btns">
                            <button class="btn-sm btn-approve" data-req-id="${req.id}" data-action="approve">
                                <i class="fas fa-check"></i> Approve
                            </button>
                            <button class="btn-sm btn-reject" data-req-id="${req.id}" data-action="reject">
                                <i class="fas fa-times"></i> Reject
                            </button>
                        </div>
                    `;
                } else {
                    actionsHtml = `<span style="color:#999;">—</span>`;
                }

                html += `
                    <tr data-request-id="${req.id}">
                        <td><strong>${req.student_id}</strong></td>
                        <td>${req.name}</td>
                        <td>${req.class}</td>
                        <td>${req.subject}</td>
                        <td>${requestedDate}</td>
                        <td><span class="status-badge ${statusClass}">${req.status}</span></td>
                        <td>${actionsHtml}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;

            // Attach event listeners
            document.querySelectorAll('.btn-approve, .btn-reject').forEach(btn => {
                btn.addEventListener('click', function() {
                    const reqId = this.dataset.reqId;
                    const action = this.dataset.action;
                    handleAction(reqId, action, this.closest('tr'));
                });
            });
        }

        // ─── HANDLE ACTION ───────────────────────────────────────────────
        async function handleAction(reqId, action, rowElement) {
            if (!examActive && action === 'approve') {
                showToast('Cannot approve while exam is inactive. Start the exam first.', 'error');
                return;
            }

            const note = prompt(`Add a note (optional) for ${action}:`);
            try {
                const res = await fetch(`/admin/reattempt_request/${reqId}/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note: note || '' })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    showToast(`Request ${action}ed successfully`, 'success');

                    if (rowElement) {
                        rowElement.remove();
                        const tbody = document.getElementById('requestsBody');
                        if (tbody.children.length === 0) {
                            tbody.innerHTML = `
                                <tr>
                                    <td colspan="7" class="empty-state">
                                        <i class="fas fa-inbox"></i>
                                        No requests found
                                    </td>
                                </tr>
                            `;
                        }
                    }

                    // Refresh data
                    fetchRequests();
                } else {
                    showToast(data.message || 'Action failed', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            }
        }

        // ─── EVENT LISTENERS ─────────────────────────────────────────────
        document.getElementById('applyFilterBtn').addEventListener('click', fetchRequests);
        document.getElementById('refreshBtn').addEventListener('click', fetchRequests);

        // Auto-refresh every 30 seconds
        setInterval(fetchRequests, 30000);

        // Initial load
        fetchRequests();
    </script>

</body>
</html>
