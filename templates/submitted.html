<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Submitted - RRB CBT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f5e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
        }
        .icon {
            font-size: 5rem;
            color: #2e7d32;
            margin-bottom: 20px;
        }
        h2 {
            color: #1b5e20;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
        }
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(46,125,50,0.3);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 20px;
            font-weight: 500;
        }
        .success { color: #2e7d32; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="watermark">RRB Group of Schools</div>
    <div class="card">
        <i class="fas fa-check-circle icon"></i>
        <h2>Exam Submitted</h2>
        <p>You have already submitted your exam for {{ session.get('class') }} - {{ session.get('subject') }}.</p>
        
        {% if pending %}
            <button class="btn" disabled><i class="fas fa-hourglass-half"></i> Request Pending</button>
            <p class="message" style="color: #f57c00;">Your reattempt request is awaiting admin approval.</p>
        {% else %}
            <button class="btn" id="requestBtn"><i class="fas fa-redo-alt"></i> Request Reattempt</button>
            <p class="message" id="requestMessage"></p>
        {% endif %}
        <!-- After the existing request button -->
        <button class="btn" id="startReattemptBtn" style="display:none; background: linear-gradient(135deg, #2e7d32, #43a047);">
            <i class="fas fa-play"></i> Start Reattempt
        </button>
<p class="message" id="statusMessage"></p>
        <div style="margin-top: 30px;">
            <a href="{{ url_for('index') }}" style="color: #2e7d32; text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        document.getElementById('requestBtn')?.addEventListener('click', function() {
            this.disabled = true;
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            fetch('/request_reattempt', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    const msgDiv = document.getElementById('requestMessage');
                    if (data.status === 'success') {
                        msgDiv.className = 'message success';
                        msgDiv.innerHTML = '<i class="fas fa-check"></i> ' + data.message;
                        this.innerHTML = '<i class="fas fa-hourglass-half"></i> Request Pending';
                    } else {
                        msgDiv.className = 'message error';
                        msgDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + data.message;
                        this.disabled = false;
                        this.innerHTML = '<i class="fas fa-redo-alt"></i> Request Reattempt';
                    }
                });
        });
        // After existing code
        let pollInterval;
        const startBtn = document.getElementById('startReattemptBtn');
        const statusMsg = document.getElementById('statusMessage');

        function checkReattemptStatus() {
            fetch('/check_reattempt_status')
                .then(res => res.json())
                .then(data => {
                    if (data.can_start) {
                        // Approved and exam active
                        startBtn.style.display = 'inline-block';
                        statusMsg.innerHTML = '<span class="success"><i class="fas fa-check"></i> Your reattempt has been approved! Click below to start.</span>';
                        clearInterval(pollInterval);
                    } else if (data.approved && !data.exam_active) {
                        statusMsg.innerHTML = '<span style="color:#f57c00;"><i class="fas fa-hourglass-half"></i> Approved, but exam not started yet. Waiting...</span>';
                    } else if (!data.approved && data.student_status === 'Not Started') {
                        // Possibly already reset? But keep checking
                        statusMsg.innerHTML = '';
                    } else {
                        statusMsg.innerHTML = '';
                    }
                });
        }

        // Start polling if there is a pending request or we're waiting
        {% if pending %}
            pollInterval = setInterval(checkReattemptStatus, 5000);
            checkReattemptStatus();
        {% else %}
            // After making a request, start polling
            const requestBtn = document.getElementById('requestBtn');
            requestBtn?.addEventListener('click', function() {
                // After successful request, start polling
                setTimeout(() => {
                    pollInterval = setInterval(checkReattemptStatus, 5000);
                    checkReattemptStatus();
                }, 1000);
            });
        {% endif %}

        startBtn.addEventListener('click', function() {
            window.location.href = '/exam';
        });
    </script>
</body>
</html>
