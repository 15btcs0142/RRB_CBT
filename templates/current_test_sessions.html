<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Test Sessions - RRB CBT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:#f0f4f8;padding:30px;min-height:100vh;}
        
        /* ─── TOP BAR ────────────────────────────────────────────────────── */
        .topbar{
            background:linear-gradient(90deg,#1a237e,#3949ab);
            color:#fff;
            padding:14px 28px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:10px;
            box-shadow:0 4px 20px rgba(0,0,0,0.15);
            border-radius:16px 16px 0 0;
        }
        .topbar h1{font-size:1.3rem;font-weight:600;display:flex;align-items:center;gap:10px;}
        .topbar h1 i{color:#667eea;}
        .topbar a{
            color:#fff;
            text-decoration:none;
            background:rgba(255,255,255,0.15);
            padding:8px 20px;
            border-radius:25px;
            font-size:0.85rem;
            transition:0.3s;
            display:inline-flex;
            align-items:center;
            gap:6px;
            border:1px solid rgba(255,255,255,0.1);
        }
        .topbar a:hover{
            background:rgba(255,255,255,0.25);
            transform:translateY(-2px);
        }
        
        .container{
            max-width:1200px;
            margin:0 auto;
            background:rgba(255,255,255,0.95);
            backdrop-filter:blur(10px);
            border-radius:0 0 16px 16px;
            padding:28px 30px;
            box-shadow:0 4px 16px rgba(0,0,0,0.06);
            border:1px solid rgba(26,35,126,0.08);
            border-top:none;
        }
        
        .page-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:12px;
            margin-bottom:20px;
        }
        .page-header h2{
            font-size:1.2rem;
            font-weight:600;
            color:#1a237e;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .page-header h2 i{color:#3949ab;}
        .page-header .sub{
            color:#888;
            font-size:0.85rem;
        }
        .badge-count{
            background:#e8eaf6;
            color:#1a237e;
            padding:4px 14px;
            border-radius:20px;
            font-size:0.75rem;
            font-weight:600;
        }
        
        /* ─── TABLE ────────────────────────────────────────────────────── */
        .table-wrap{
            overflow-x:auto;
            border-radius:12px;
            border:1px solid rgba(26,35,126,0.08);
        }
        table{
            width:100%;
            border-collapse:collapse;
            font-size:0.85rem;
        }
        th{
            background:linear-gradient(135deg,#1a237e,#3949ab);
            color:#fff;
            font-weight:600;
            padding:12px 14px;
            text-align:left;
            border-bottom:2px solid #e2e8f0;
            white-space:nowrap;
        }
        th i{margin-right:6px;opacity:0.7;}
        td{
            padding:10px 14px;
            border-bottom:1px solid #f0f0f0;
        }
        tr:hover td{background:#e8eaf6;}
        tr:last-child td{border-bottom:none;}
        
        .badge{
            background:#e8eaf6;
            color:#1a237e;
            padding:2px 12px;
            border-radius:30px;
            font-size:0.75rem;
            font-weight:500;
            display:inline-block;
        }
        
        .btn{
            display:inline-flex;
            align-items:center;
            gap:6px;
            padding:6px 16px;
            border:none;
            border-radius:30px;
            font-weight:600;
            font-size:0.78rem;
            cursor:pointer;
            transition:.25s;
            text-decoration:none;
            font-family:'Poppins',sans-serif;
        }
        .btn-primary{
            background:linear-gradient(135deg,#1a237e,#3949ab);
            color:#fff;
        }
        .btn-primary:hover{
            transform:translateY(-2px);
            box-shadow:0 4px 12px rgba(26,35,126,0.3);
        }
        .btn-sm{padding:4px 14px;font-size:0.72rem;}
        
        .empty{
            text-align:center;
            padding:50px 20px;
            color:#999;
        }
        .empty i{
            font-size:2.5rem;
            color:#ddd;
            display:block;
            margin-bottom:12px;
        }
        
        .back-link{
            display:inline-flex;
            align-items:center;
            gap:6px;
            margin-top:20px;
            color:#1a237e;
            text-decoration:none;
            font-weight:500;
            font-size:0.85rem;
            transition:0.3s;
        }
        .back-link:hover{
            color:#3949ab;
            transform:translateX(-3px);
        }
        .back-link i{color:#3949ab;}
        
        /* ─── RESPONSIVE ────────────────────────────────────────────────── */
        @media(max-width:768px){
            body{padding:15px;}
            .container{padding:16px 18px;}
            .topbar{flex-direction:column;text-align:center;padding:12px 16px;}
            .topbar a{font-size:0.75rem;padding:6px 14px;}
            .page-header{flex-direction:column;align-items:flex-start;}
            table{font-size:0.75rem;}
            th,td{padding:8px 10px;}
        }
        @media(max-width:480px){
            .container{padding:12px 14px;}
            th,td{padding:6px 8px;font-size:0.7rem;}
            .btn{font-size:0.65rem;padding:3px 10px;}
        }
    </style>
</head>
<body>

    <!-- ─── TOP BAR ─────────────────────────────────────────────────────── -->
    <div class="topbar">
        <h1><i class="fas fa-clock"></i> Recent Test Sessions</h1>
        <a href="{{ url_for('admin_dashboard') }}"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="container">

        <!-- ─── PAGE HEADER ─────────────────────────────────────────────── -->
        <div class="page-header">
            <div>
                <h2><i class="fas fa-file-alt"></i> Test Sessions</h2>
                <p class="sub">Select a test to generate the current test report (PDF/Excel).</p>
            </div>
            <span class="badge-count" id="sessionCount">0 sessions</span>
        </div>

        <!-- ─── TABLE ────────────────────────────────────────────────────── -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th><i class="fas fa-calendar-alt"></i> Date & Time</th>
                        <th><i class="fas fa-graduation-cap"></i> Class</th>
                        <th><i class="fas fa-columns"></i> Section</th>
                        <th><i class="fas fa-book"></i> Subject</th>
                        <th><i class="fas fa-hashtag"></i> Test No</th>
                        <th><i class="fas fa-users"></i> Students</th>
                        <th><i class="fas fa-cog"></i> Action</th>
                    </tr>
                </thead>
                <tbody id="sessionsBody">
                    <tr>
                        <td colspan="7" style="text-align:center;padding:40px;color:#94a3b8;">
                            <i class="fas fa-spinner fa-spin" style="font-size:1.5rem;display:block;margin-bottom:10px;"></i>
                            Loading...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ─── BACK LINK ────────────────────────────────────────────────── -->
        <a href="{{ url_for('admin_dashboard') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

    
<footer class="app-global-footer" style="width:100%; text-align:center; padding:20px 10px; font-size:0.85rem; color:#666; opacity:0.85; margin-top:30px; border-top:1px solid rgba(0,0,0,0.08); box-sizing:border-box; clear:both;">
    Developed by Gaurav Shukla &amp; Team
</footer>
</div>

    <script>
        async function loadSessions() {
            const tbody = document.getElementById('sessionsBody');
            const countBadge = document.getElementById('sessionCount');
            try {
                const res = await fetch('/api/admin/recent_test_sessions');
                const data = await res.json();
                if (!data.sessions || data.sessions.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty">
                                <i class="fas fa-search"></i>
                                No test sessions found
                            </td>
                        </tr>
                    `;
                    countBadge.textContent = '0 sessions';
                    return;
                }
                let html = '';
                data.sessions.forEach((s, index) => {
                    const dateObj = new Date(s.test_date);
                    const formattedDate = dateObj.toLocaleDateString('en-IN', {
                        day:'2-digit',
                        month:'short',
                        year:'numeric'
                    });
                    const formattedTime = dateObj.toLocaleTimeString('en-IN', {
                        hour:'2-digit',
                        minute:'2-digit'
                    });
                    const section = s.section || '—';
                    const rowClass = index % 2 === 0 ? '' : 'style="background:#fafafa;"';
                    html += `
                        <tr ${rowClass}>
                            <td><i class="far fa-clock" style="color:#3949ab;margin-right:6px;"></i>${formattedDate} ${formattedTime}</td>
                            <td><span class="badge">${s.class}</span></td>
                            <td>${section}</td>
                            <td>${s.subject}</td>
                            <td>${s.test_no || '—'}</td>
                            <td><strong>${s.student_count}</strong></td>
                            <td>
                                <a href="{{ url_for('current_test_results') }}?class=${encodeURIComponent(s.class)}&section=${encodeURIComponent(s.section || '')}&subject=${encodeURIComponent(s.subject)}&test_no=${encodeURIComponent(s.test_no || '')}&date=${s.test_date}" 
                                   target="_blank" 
                                   class="btn btn-primary btn-sm">
                                    <i class="fas fa-file-alt"></i> Generate
                                </a>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
                countBadge.textContent = `${data.sessions.length} sessions`;
            } catch (err) {
                console.error('Failed to load sessions:', err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty">
                            <i class="fas fa-exclamation-circle"></i>
                            Failed to load sessions
                        </td>
                    </tr>
                `;
                countBadge.textContent = 'Error loading';
            }
        }
        loadSessions();
    </script>

</body>
</html>
